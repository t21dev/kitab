[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/t21dev/kitab"
homepage = "https://github.com/t21dev/kitab"
authors = ["t21 dev and contributors"]

[workspace.dependencies]
kitab-core = { path = "crates/kitab-core" }
kitab-theme = { path = "crates/kitab-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = "0.2.2"
# Phase 4 formats: html (MOBI, FB2, TXT and EPUB's engine), epub, xps, cbz, and
# svg for SVG pictures inside books. Not img: Kitab doesn't open image files.
# Not system-fonts (font-kit took 23 s per small EPUB): kitab-mupdf's fonts.rs
# maps scripts to system font files instead.
# base14-fonts: PDFs may use the 14 standard fonts without embedding them (ADR 0001).
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "html", "epub", "xps", "cbz", "svg"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Kitab's patched gpui (ADR 0002, docs/perf/baseline.md). Create it with
# `python tools/patch_gpui.py` after cloning; the folder is git-ignored.
[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
