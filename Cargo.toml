[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/t21dev/kitab"
homepage = "https://github.com/t21dev/kitab"
authors = ["t21 dev and contributors"]

[workspace.dependencies]
kitab-core = { path = "crates/kitab-core" }
kitab-theme = { path = "crates/kitab-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
