# cargo-deny configuration (AGENTS.md rule 25).
# Kitab is AGPL-3.0-or-later, so every dependency must be AGPL-compatible.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# zbus is xcap's Linux (Wayland portal) backend. kitab-bench uses xcap on Windows only
# (a Windows-only dependency), and kitab-bench is a dev tool that never ships. Remove
# these when xcap moves off zbus 5 or kitab-bench gains Linux support.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only path of a Windows-only dev tool (kitab-bench via xcap)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only path of a Windows-only dev tool (kitab-bench via xcap)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only path of a Windows-only dev tool (kitab-bench via xcap)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is a policy, not an inventory: allow entries no crate uses yet.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "AGPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # libfuzzer-sys (rav1e, through GPUI's image crate): OSI and FSF free, AGPL-compatible.
    "NCSA",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Unlicense",
]
# The mupdf bindings declare the deprecated SPDX id "AGPL-3.0" (MuPDF itself is
# AGPL-3.0-or-later). Allowed for those two crates only.
exceptions = [
    { crate = "mupdf", allow = ["AGPL-3.0"] },
    { crate = "mupdf-sys", allow = ["AGPL-3.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI is pinned to a git revision (AGENTS.md rule 26); add its repository
# here in the same PR that adds the dependency.
allow-git = []
