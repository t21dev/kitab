name: Release

# A v* tag builds every download and publishes the release (modelled on the
# Porter app's). Run it by hand with dry_run to build the downloads as
# workflow artifacts only, without touching releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the downloads as workflow artifacts; don't publish
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One draft release, made before any build starts, so the parallel builds
  # upload into the same release.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          cat > body.md <<EOF
          $NOTES

          ## Downloads
          | System | File |
          |---|---|
          | Windows (Intel, AMD) | \`Kitab_${VERSION}_x64_setup.exe\` installs for your account, with no administrator prompt. \`Kitab_${VERSION}_x64_portable.zip\` runs without installing. |
          | Windows on Arm | The x64 downloads; Windows runs them through its emulation. |
          | macOS, Apple silicon | \`Kitab_${VERSION}_aarch64.dmg\` |
          | macOS, Intel | \`Kitab_${VERSION}_x86_64.dmg\` |
          | Linux | \`.flatpak\`, \`.AppImage\`, \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, openSUSE) or \`.tar.gz\` (unpack it and run \`./install.sh\`). x86_64, and aarch64 except the Flatpak. |

          Or with a package manager: \`brew install --cask t21dev/tap/kitab\` on macOS; \`scoop bucket add t21dev https://github.com/t21dev/scoop-bucket\` and then \`scoop install t21dev/kitab\` on Windows.

          ## Unsigned builds
          These downloads aren't code-signed yet. On Windows, SmartScreen may say "Windows protected your PC": choose More info, then Run anyway. On macOS, the first time, right-click Kitab in Applications and choose Open, or run \`xattr -cr /Applications/Kitab.app\`. Check any download against the SHA-256 checksums at the end of these notes.
          EOF
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Kitab Reader $VERSION" \
            -F draft=true -F prerelease=false -F body=@body.md --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Windows x64 (Windows on Arm runs it too), macOS Apple silicon and
        # Intel, Linux x86_64 and aarch64 (Ubuntu 22.04: the oldest glibc
        # GitHub still offers). Not windows-11-arm yet: mupdf-sys 0.8 only
        # builds MuPDF for x86 and x64 with MSVC.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig1-dev libfreetype-dev \
            libasound2-dev libzstd-dev rpm
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Patched gpui
        run: python tools/patch_gpui.py
      - uses: swatinem/rust-cache@v2
        with:
          key: release
      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev" >> "$GITHUB_OUTPUT"
          fi
      # Windows: C runtime linked in (no VC++ Redistributable needed).
      - name: Build
        run: python tools/build_release.py
      - name: No Visual C++ runtime needed (Windows)
        if: runner.os == 'Windows'
        run: python tools/check_imports.py target/release/kitab.exe target/release/kitab_shell.dll
      - name: Package
        run: python tools/package.py ${{ steps.v.outputs.version }}
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DArch=$arch" "/DSourceDir=..\..\dist\Kitab" packaging\windows\kitab.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The Microsoft Store package: uploaded in Partner Center by hand (the
      # Store signs it), so it's a workflow artifact, not a release download.
      - name: Store package (Windows)
        if: runner.os == 'Windows'
        # The GitHub downloads above never wait on the Store package.
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python tools/package_msix.py ${{ steps.v.outputs.version }}
      - name: Store package artifact (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kitab-msstore
          path: dist/*.msix
      - name: Collect downloads
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.zip dist/*.exe dist/*.dmg dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage out/ 2>/dev/null || true
          ls -la out
      - name: Artifacts (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kitab-${{ matrix.os }}
          path: out/*
      - name: Upload to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in out/*; do
            name=$(basename "$f")
            gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq .name
          done

  # A .flatpak bundle, built from source and offline in Flathub's own
  # builder image, the way Flathub builds it.
  flatpak:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # The runner's preinstalled tools, mounted to be deleted: the SDK, LLVM
      # and the Rust build don't fit beside them.
      options: >-
        --privileged
        -v /usr/share/dotnet:/hostfree/dotnet
        -v /usr/local/lib/android:/hostfree/android
        -v /opt/ghc:/hostfree/ghc
        -v /opt/hostedtoolcache:/hostfree/toolcache
    steps:
      - name: Free disk space
        run: |
          rm -rf /hostfree/dotnet/* /hostfree/android/* /hostfree/ghc/* /hostfree/toolcache/* || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Patched gpui and offline crate sources
        run: |
          python3 tools/patch_gpui.py
          python3 -c "import aiohttp, tomlkit" 2>/dev/null || python3 -m pip install --quiet aiohttp tomlkit || dnf install -y python3-aiohttp python3-tomlkit
          sh packaging/flatpak/generate-sources.sh
      - name: Build the Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean \
            --disable-rofiles-fuse build-dir packaging/flatpak/dev.t21.kitab.yml
          if [ "${{ github.event_name }}" = "push" ]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=dev; fi
          echo "BUNDLE=Kitab_${VERSION}_x86_64.flatpak" >> "$GITHUB_ENV"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "Kitab_${VERSION}_x86_64.flatpak" dev.t21.kitab
      - name: Artifact (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kitab-flatpak
          path: ${{ env.BUNDLE }}
      - name: Upload to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$BUNDLE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$BUNDLE"

  # Every build uploaded: SHA-256 sums beside the downloads and at the end
  # of the notes, then publish.
  publish:
    needs: [create-release, build, flatpak]
    # Publish what was built even if one system's build failed; its file is
    # simply missing and can be added to the release later.
    if: always() && github.event_name == 'push' && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl
          gh api "repos/$REPO/releases/$ID/assets" --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r asset name; do
              [ "$name" = "SHA256SUMS.txt" ] && continue
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > "dl/$name"
            done
          (cd dl && sha256sum -- * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          gh api "repos/$REPO/releases/$ID" --jq .body > body.md
          printf '\n## SHA-256 checksums\n\n```\n%s\n```\n' "$(cat SHA256SUMS.txt)" >> body.md
          gh api -X PATCH "repos/$REPO/releases/$ID" -f tag_name="$TAG" -F body=@body.md \
            -F draft=false -f make_latest=true --jq .html_url
