[package]
name = "kitab-shell"
description = "Kitab Reader: the Windows Explorer thumbnail provider (kitab_shell.dll)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib: the DLL Explorer loads. rlib: so the tests can call it in-process.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# The same windows crate gpui 0.2.2 and kitab-os use.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61"

[target.'cfg(windows)'.dev-dependencies]
# The Explorer end-to-end test registers the provider the way Kitab does.
kitab-os = { path = "../kitab-os" }

# COM and Win32 need unsafe; each block has a SAFETY comment (AGENTS.md rule 10).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
