[package]
name = "kitab-print"
description = "Kitab Reader's printing: page placement and the native print path per OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
# The same windows crate gpui uses (no second copy in the binary).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

# unsafe is allowed in this crate only for the OS print calls, each with a
# SAFETY comment (AGENTS.md rule 10).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
