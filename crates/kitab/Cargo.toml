[package]
name = "kitab"
description = "Kitab Reader: a fast, native reader for PDF, EPUB, Markdown and comics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Already in the tree through gpui: a channel for files from later launches.
smol = "2"
gpui = { workspace = true }
kitab-mupdf = { path = "../kitab-mupdf" }
kitab-print = { path = "../kitab-print" }
kitab-sign = { path = "../kitab-sign" }
kitab-store = { path = "../kitab-store" }
log = "0.4"
kitab-core = { workspace = true }
kitab-theme = { workspace = true }
kitab-ui = { path = "../kitab-ui" }
kitab-os = { path = "../kitab-os" }
# `kitab --thumbnail`: file-manager thumbnails, sharing kitab.exe's MuPDF.
kitab-thumb = { path = "../kitab-thumb" }

[build-dependencies]
# Already in the tree through gpui: embeds the icons in kitab.exe.
embed-resource = "3"

[lints]
workspace = true
