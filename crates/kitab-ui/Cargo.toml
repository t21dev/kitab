[package]
name = "kitab-ui"
description = "Kitab Reader's GPUI views: shell, tabs, reader, outline, scrubber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kitab-md = { path = "../kitab-md" }
gpui = { workspace = true }
kitab-core = { workspace = true }
kitab-theme = { workspace = true }
kitab-os = { path = "../kitab-os" }
serde = { workspace = true }
serde_json = { workspace = true }
# gpui 0.2.2's own image and error types (same versions, no new code in the binary).
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
log = "0.4"
# Round caps and joins for pen strokes. The same lyon copy GPUI draws paths with.
lyon_tessellation = "1"

[lints]
workspace = true
