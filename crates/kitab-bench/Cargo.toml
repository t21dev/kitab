[package]
name = "kitab-bench"
description = "Black-box start-up benchmark for Kitab and SumatraPDF (PLAN.md §6.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Per-window capture with a safe API: PrintWindow (full content), which reads the window's
# own pixels even when it is covered, including GPU-composed windows such as GPUI's.
# Windows Graphics Capture was tried: it never delivers a frame for a GPUI window that
# draws once. Never capture the screen: it reads other apps' content and gives false results.
# Windows-only: the benchmark runs on the Windows reference machine (PLAN.md §6.4). Apache-2.0.
xcap = { version = "0.9.8", default-features = false }
# Process memory and CPU time (working set, private bytes, user + kernel time). MIT.
kitab-os = { path = "../kitab-os", features = ["input"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(windows)'.build-dependencies]
# Already in the tree via gpui; embeds the DPI-aware manifest.
embed-resource = "3"

[lints]
workspace = true
