[package]
name = "kitab-store"
description = "SQLite storage for Kitab Reader: library, reading state, sessions, bookmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Internal crate of the app, never published (lets cargo-deny accept the path dependency).
publish = false

[dependencies]
kitab-core = { workspace = true }
# SQLite with a pinned, statically linked copy (WAL, STRICT tables, no system lib). MIT.
# 0.40 is the newest release that builds on the workspace MSRV (0.41 needs Rust 1.89).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Stable file identity across moves and renames: volume serial + file id on Windows,
# dev + inode on Unix. Keeps the Win32 `unsafe` out of this crate. MIT OR Apache-2.0.
file-id = "0.2.3"
# XXH3 for the quick hash (size + first/last 64 KiB). Pure Rust, no deps. BSL-1.0.
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }
# Typed error enum. MIT OR Apache-2.0.
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
