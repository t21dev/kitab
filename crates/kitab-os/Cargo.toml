[package]
name = "kitab-os"
description = "Kitab Reader's platform layer: first-frame splash, data folders, single instance, file associations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Posts mouse messages to one window by handle, for kitab-bench screenshots of
# menus and dialogs. Never enabled by the app (AGENTS.md rule 14).
input = []

[dependencies]
# Reads GitHub's latest-release answer (update.rs); already in the app.
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The same windows crate gpui 0.2.2 uses (no second copy in the binary).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# The local date for reading streaks (localtime_r); already in the tree.
libc = "0.2"

# unsafe is allowed in this crate only for Win32 calls, each with a SAFETY comment
# (AGENTS.md rule 10), so it takes the workspace lints minus unsafe_code.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
