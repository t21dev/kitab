[package]
name = "kitab-os"
description = "Kitab Reader's platform layer: first-frame splash, data folders, single instance, file associations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Posts mouse messages to one window by handle, for kitab-bench screenshots of
# menus and dialogs. Never enabled by the app (AGENTS.md rule 14).
input = []

[target.'cfg(windows)'.dependencies]
# The same windows crate gpui 0.2.2 uses (no second copy in the binary).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# unsafe is allowed in this crate only for Win32 calls, each with a SAFETY comment
# (AGENTS.md rule 10), so it takes the workspace lints minus unsafe_code.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
